<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Scr33nX</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 240px;
      background: #0a0a0b;
      color: #f2f2f4;
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 13px;
    }

    .header {
      background: #101011;
      padding: 9px 14px;
      border-bottom: 2px solid #ff2b3d;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .header .dot  { color: #ff2b3d; font-size: 15px; line-height: 1; }
    .header .title { font-weight: 700; font-size: 12px; letter-spacing: 1px; color: #f2f2f4; }

    .body { padding: 13px 14px 14px; }

    .model-name {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }
    .site-label {
      font-size: 10px;
      color: #56565c;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 11px;
    }

    .status-badge {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 3px;
      background: #17171a;
      margin-bottom: 11px;
    }
    .status-badge.recording { color: #ff2b3d; }
    .status-badge.online    { color: #3ecf8e; }
    .status-badge.offline   { color: #56565c; }
    .status-badge.checking  { color: #ffc14d; }

    .btn {
      display: block;
      width: 100%;
      padding: 7px 10px;
      margin-bottom: 6px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      transition: opacity 0.12s;
    }
    .btn:last-of-type { margin-bottom: 0; }
    .btn:hover:not(:disabled) { opacity: 0.82; }
    .btn:disabled { opacity: 0.38; cursor: default; }
    .btn-rec   { background: #3ecf8e; color: #0a0a0b; }
    .btn-saved { background: #ff2b3d; color: #0a0a0b; }
    .btn-start { background: #3ecf8e; color: #0a0a0b; }
    .btn-stop  { background: #ff2b3d; color: #fff; }
    .btn-ghost { background: #17171a; color: #8a8a90; cursor: default; }
    .btn-remove {
      background: transparent;
      color: #56565c;
      border: 1px solid #272729;
      font-size: 11px;
      padding: 5px 10px;
      margin-top: 2px;
    }
    .btn-remove:hover:not(:disabled) {
      color: #ff2b3d;
      border-color: #ff2b3d;
      opacity: 1;
    }

    .auto-row {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 2px;
      margin-bottom: 6px;
      font-size: 12px;
      color: #8a8a90;
      cursor: pointer;
      user-select: none;
    }
    .auto-row:hover { color: #f2f2f4; }
    .auto-row input { accent-color: #ff2b3d; cursor: pointer; }
    .auto-row input:disabled { cursor: default; }

    .msg {
      text-align: center;
      padding: 18px 0 14px;
      color: #56565c;
      font-size: 12px;
      line-height: 1.6;
    }
    .msg .icon { font-size: 26px; display: block; margin-bottom: 6px; }

    .feedback {
      font-size: 11px;
      text-align: center;
      padding: 5px 8px;
      border-radius: 3px;
      margin-top: 7px;
    }
    .feedback.ok  { background: #10241a; color: #3ecf8e; }
    .feedback.err { background: #2a0c0f; color: #ff2b3d; }
  </style>
</head>
<body>
  <div class="header">
    <img class="dot" src="icons/devil32.png" width="18" height="18" alt="">

    <span class="title">Scr33nX</span>
  </div>
  <div class="body" id="root">
    <div class="msg"><span class="icon">⏳</span>Loading…</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
